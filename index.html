<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova — Capital Finder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f14;
            color: white;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #11161d;
            border-right: 1px solid #252c35;
            padding: 20px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .new-chat:hover {
            background: #1d4ed8;
        }

        .memory-title {
            margin-top: 30px;
            color: #8b949e;
            font-size: 13px;
        }

        .memory-status {
            margin-top: 10px;
            color: #7ee787;
            font-size: 14px;
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 65px;
            border-bottom: 1px solid #252c35;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            color: #7ee787;
            font-size: 13px;
        }

        /* CHAT */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .welcome {
            text-align: center;
            max-width: 650px;
            margin: 90px auto;
        }

        .welcome h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .welcome p {
            color: #8b949e;
            font-size: 17px;
        }

        .message-wrapper {
            max-width: 850px;
            margin: 0 auto 18px;
            display: flex;
        }

        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user {
            background: #2563eb;
        }

        .message.nova {
            background: #171d25;
            border: 1px solid #29323d;
        }

        /* INPUT */

        .input-area {
            border-top: 1px solid #252c35;
            padding: 18px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #11161d;
            color: white;
            border: 1px solid #303944;
            border-radius: 12px;
            padding: 15px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button.send {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            cursor: pointer;
            font-weight: bold;
        }

        button.send:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .chat {
                padding: 20px;
            }

            .message {
                max-width: 90%;
            }

            .welcome h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">
                Nova
            </div>

            <button class="new-chat" onclick="newChat()">
                + New Chat
            </button>

            <div class="memory-title">
                NOVA MEMORY
            </div>

            <div class="memory-status">
                ● 195 countries loaded
            </div>

        </aside>


        <main class="main">

            <header class="topbar">

                <div class="title">
                    Nova AI
                </div>

                <div class="status">
                    ● Memory Online
                </div>

            </header>


            <section class="chat" id="chat">

                <div class="welcome" id="welcome">

                    <h1>Hi, I'm Nova</h1>

                    <p>
                        Ask me for the capital of any country.
                    </p>

                </div>

            </section>


            <div class="input-area">

                <div class="input-box">

                    <input id="question" type="text" placeholder="What is the capital of India?" autocomplete="off">

                    <button class="send" onclick="askNova()">
                        Send
                    </button>

                </div>

            </div>

        </main>

    </div>

        const aliases = {

            "usa": "united states",
            "us": "united states",
            "america": "united states",

            "uk": "united kingdom",
            "britain": "united kingdom",
            "england": "united kingdom",

            "drc": "democratic republic of the congo",

            "czech republic": "czechia",

            "cape verde": "cabo verde",

            "swaziland": "eswatini",

            "turkiye": "turkey"
        };


        const input = document.getElementById("question");
        const chat = document.getElementById("chat");


        function addMessage(text, sender) {

            const welcome = document.getElementById("welcome");

            if (welcome) {
                welcome.style.display = "none";
            }

            const wrapper = document.createElement("div");

            wrapper.className = "message-wrapper " + sender;

            const message = document.createElement("div");

            message.className = "message " + sender;

            message.textContent = text;

            wrapper.appendChild(message);

            chat.appendChild(wrapper);

            chat.scrollTop = chat.scrollHeight;
        }



        function normalize(text) {

            text = text
                .toLowerCase()
                .trim();

            text = text
                .replace(/[?.!,]/g, "")
                .replace(/\s+/g, " ");

            return text;
        }

        function findCountry(question) {

            let text = normalize(question);


            const countries = Object.keys(novaMemory)
                .sort((a, b) => b.length - a.length);


            for (const country of countries) {

                if (text.includes(country)) {
                    return country;
                }
            }




            for (const alias in aliases) {

                if (text.includes(alias)) {

                    return aliases[alias];

                }
            }


            return null;
        }

        function askNova() {

            const question = input.value.trim();

            if (!question) {
                return;
            }


            addMessage(question, "user");

            input.value = "";


            const country = findCountry(question);


            if (country) {

                const capital = novaMemory[country];

                setTimeout(() => {

                    addMessage(
                        `The capital of ${formatCountry(country)} is ${capital}.`,
                        "nova"
                    );

                }, 250);

                return;
            }


            /*
                General help
            */

            setTimeout(() => {

                addMessage(
                    "I don't have that country in my memory yet. Try asking something like \"What is the capital of India?\"",
                    "nova"
                );

            }, 250);
        }




        function formatCountry(country) {

            return country
                .split(" ")
                .map(word =>
                    word.charAt(0).toUpperCase() + word.slice(1)
                )
                .join(" ");
        }



        function newChat() {

            chat.innerHTML = `

        <div class="welcome" id="welcome">

            <h1>Hi, I'm Nova</h1>

            <p>
                Ask me for the capital of any country.
            </p>

        </div>

    `;

            input.focus();
        }




        input.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                askNova();

            }

        });


        input.focus();
